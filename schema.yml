components:
  schemas:
    AccountProvider:
      properties:
        account:
          format: uuid
          readOnly: true
          type: string
        commitment:
          format: uuid
          nullable: true
          type: string
        display_name:
          type: string
        enable_commitment:
          type: boolean
        id:
          format: uuid
          readOnly: true
          type: string
        is_builtin:
          type: boolean
        is_disabled:
          type: boolean
        provider:
          type: integer
        provider_details:
          allOf:
          - $ref: '#/components/schemas/Provider'
          readOnly: true
        service_ids:
          readOnly: true
          type: string
        service_uids:
          readOnly: true
          type: string
      required:
      - account
      - id
      - provider
      - provider_details
      - service_ids
      - service_uids
      type: object
    AccountProviderCommitment:
      properties:
        account_providers:
          items:
            format: uuid
            type: string
          type: array
        average_object_size_bytes:
          format: double
          minimum: 0
          nullable: true
          type: number
        commitment_gb_per_month:
          format: double
          minimum: 0
          nullable: true
          type: number
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          type: string
      required:
      - account_providers
      - id
      - name
      type: object
    Alert:
      properties:
        account:
          format: uuid
          readOnly: true
          type: string
        account_providers:
          items:
            format: uuid
            type: string
          type: array
        alert_type:
          maxLength: 255
          type: string
        channels:
          items:
            format: uuid
            type: string
          type: array
        enabled:
          type: boolean
        health_checks:
          items:
            format: uuid
            type: string
          type: array
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s]*$
          type: string
        restrict_to_account_providers:
          type: boolean
        restrict_to_health_checks:
          type: boolean
        restrict_to_services:
          type: boolean
        services:
          items:
            format: uuid
            type: string
          type: array
        threshold:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
      required:
      - account
      - alert_type
      - channels
      - id
      - name
      type: object
    AlertChannel:
      properties:
        account:
          format: uuid
          readOnly: true
          type: string
        channel_destination:
          maxLength: 512
          nullable: true
          type: string
        channel_type:
          $ref: '#/components/schemas/ChannelTypeEnum'
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s]*$
          type: string
      required:
      - account
      - channel_type
      - id
      - name
      type: object
    Behavior:
      properties:
        additional_paths:
          nullable: true
          type: string
        behavior_actions:
          items:
            $ref: '#/components/schemas/BehaviorAction'
          type: array
        complex_condition:
          nullable: true
        id:
          format: uuid
          readOnly: true
          type: string
        is_default:
          type: boolean
        is_partially_contained:
          type: boolean
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s./]*$
          type: string
        path_pattern:
          maxLength: 1024
          type: string
        service:
          format: uuid
          type: string
      required:
      - behavior_actions
      - id
      - name
      - service
      type: object
    BehaviorAction:
      properties:
        add_cache_tag:
          nullable: true
          type: string
        allow_access_only_from_ip:
          nullable: true
        allowed_methods:
          type: string
        auto_minify:
          maxLength: 1024
          nullable: true
          type: string
        cache_behavior_value:
          maxLength: 255
          nullable: true
          type: string
        cache_key:
          nullable: true
          type: string
        cache_tag_response_header:
          nullable: true
          type: string
        cached_methods:
          type: string
        cookie:
          maxLength: 255
          nullable: true
          type: string
        cors_allow_origin_domain:
          type: boolean
        deny_access_by_ip:
          nullable: true
        deny_access_by_time:
          nullable: true
        enable_websockets:
          nullable: true
          type: boolean
        enabled:
          nullable: true
          type: boolean
        generate_preflight_allowed_headers:
          nullable: true
          type: string
        host_header:
          maxLength: 255
          nullable: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        max_ttl:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        origin:
          format: uuid
          nullable: true
          type: string
        origin_cache_control_enabled:
          nullable: true
          type: boolean
        override_header_value:
          nullable: true
          type: boolean
        pattern:
          maxLength: 1024
          nullable: true
          type: string
        redirect_source:
          nullable: true
          type: string
        redirect_url:
          nullable: true
          type: string
        remove_query_strings:
          nullable: true
        request_header_name:
          maxLength: 255
          nullable: true
          type: string
        request_header_value:
          maxLength: 255
          nullable: true
          type: string
        response_header_name:
          maxLength: 1024
          nullable: true
          type: string
        response_header_value:
          maxLength: 4096
          nullable: true
          type: string
        response_page_path:
          nullable: true
          type: string
        status_code:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        type:
          maxLength: 255
          type: string
        unified_log_destination:
          format: uuid
          nullable: true
          type: string
        unified_log_sampling_rate:
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          type: integer
        unmanaged_behavior:
          nullable: true
          type: string
        url_rewrite_destination:
          nullable: true
          type: string
        url_rewrite_source:
          nullable: true
          type: string
        use_domain_origin:
          nullable: true
          type: boolean
        viewer_protocol:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ViewerProtocolEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - id
      - type
      type: object
    BlankEnum:
      enum:
      - ''
    Certificate:
      properties:
        account:
          format: uuid
          readOnly: true
          type: string
        certificate:
          description: Certificate required for a Self-Managed certificate
          type: string
          writeOnly: true
        certificate_chain:
          description: Certificate Authority (CA) chain required for a                                                 Self-Managed
            certificate
          type: string
          writeOnly: true
        challenges:
          readOnly: true
          type: string
        cn:
          description: Fully qualified domain names for which the certificate is issued,
            required for a Managed certificate
          maxLength: 8192
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          type: string
        not_valid_after:
          description: Certificate expiration date
          format: date-time
          nullable: true
          readOnly: true
          type: string
        private_key:
          description: Private key required for a Self-Managed certificate
          type: string
          writeOnly: true
        providers_certificates:
          description: Required for an External certificate
          items:
            $ref: '#/components/schemas/ProviderCertificate'
          type: array
        status:
          readOnly: true
          type: string
        status_text:
          readOnly: true
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/CertificateTypeEnum'
          description: 'Certificate type


            * `MANAGED` - Certificate created and managed by the IO River platform

            * `SELF_MANAGED` - Self created and managed certificate

            * `EXTERNAL` - Certificate manually deployed and managed in each provider'
      required:
      - account
      - challenges
      - id
      - name
      - not_valid_after
      - status
      - status_text
      - type
      type: object
    CertificateTypeEnum:
      description: '* `MANAGED` - Certificate created and managed by the IO River
        platform

        * `SELF_MANAGED` - Self created and managed certificate

        * `EXTERNAL` - Certificate manually deployed and managed in each provider'
      enum:
      - MANAGED
      - SELF_MANAGED
      - EXTERNAL
      type: string
    ChannelTypeEnum:
      description: '* `slack` - Slack

        * `email` - Email

        * `admin` - Admin'
      enum:
      - slack
      - email
      - admin
      type: string
    Compute:
      properties:
        compute_routes:
          items:
            $ref: '#/components/schemas/ComputeRoute'
          type: array
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          pattern: ^(?=[a-zA-Z_])(?=\S)([a-zA-Z]|[a-zA-Z][a-zA-Z0-9_\- ]+)$
          type: string
        request_code:
          maxLength: 1048576
          nullable: true
          type: string
        response_code:
          maxLength: 1048576
          nullable: true
          type: string
        service:
          format: uuid
          type: string
      required:
      - compute_routes
      - id
      - name
      - service
      type: object
    ComputeRoute:
      properties:
        domain:
          maxLength: 255
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        path:
          maxLength: 1024
          type: string
      required:
      - domain
      - id
      - path
      type: object
    DomainConfig:
      properties:
        aliases:
          items:
            maxLength: 255
            type: string
          maxItems: 10
          type: array
        domain:
          maxLength: 255
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        mappings:
          items:
            $ref: '#/components/schemas/DomainMappingTarget'
          type: array
        service:
          format: uuid
          readOnly: true
          type: string
      required:
      - aliases
      - domain
      - id
      - mappings
      - service
      type: object
    DomainMappingTarget:
      properties:
        id:
          format: uuid
          readOnly: true
          type: string
        path_pattern:
          maxLength: 1024
          nullable: true
          type: string
        target_id:
          format: uuid
          type: string
        target_type:
          default: origin
          oneOf:
          - $ref: '#/components/schemas/TargetTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - id
      - target_id
      type: object
    FileFormatEnum:
      description: '* `json-list` - Json List

        * `json-object` - Json Object

        * `json-line-delimited` - Json Line Delimited

        * `csv` - Csv'
      enum:
      - json-list
      - json-object
      - json-line-delimited
      - csv
      type: string
    GeoRestriction:
      properties:
        countries:
          items:
            $ref: '#/components/schemas/GeoRestrictionCountry'
          type: array
        id:
          format: uuid
          readOnly: true
          type: string
        service:
          format: uuid
          type: string
        type:
          $ref: '#/components/schemas/GeoRestrictionTypeEnum'
      required:
      - countries
      - id
      - service
      - type
      type: object
    GeoRestrictionCountry:
      properties:
        country:
          description: Country 2 letter iso code
          maxLength: 2
          type: string
      required:
      - country
      type: object
    GeoRestrictionTypeEnum:
      description: '* `allow` - Allow

        * `deny` - Deny'
      enum:
      - allow
      - deny
      type: string
    HealthCheck:
      properties:
        enabled:
          type: boolean
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s]*$
          type: string
        service:
          format: uuid
          type: string
        url:
          maxLength: 4096
          type: string
      required:
      - id
      - name
      - service
      - url
      type: object
    LoadBalancer:
      properties:
        custom_rules:
          items:
            $ref: '#/components/schemas/LoadBalancerCustomRule'
          readOnly: true
          type: array
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s]*$
          type: string
        origin_sets:
          items:
            $ref: '#/components/schemas/LoadBalancerOriginSet'
          type: array
        service:
          format: uuid
          type: string
        type:
          $ref: '#/components/schemas/LoadBalancerTypeEnum'
      required:
      - custom_rules
      - id
      - name
      - origin_sets
      - service
      - type
      type: object
    LoadBalancerCustomRule:
      properties:
        id:
          format: uuid
          readOnly: true
          type: string
        load_balancer:
          format: uuid
          type: string
        matching_rule: {}
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s]*$
          type: string
        origin_set:
          format: uuid
          type: string
        origin_set_name:
          readOnly: true
          type: string
        priority:
          format: int64
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          nullable: true
          type: integer
      required:
      - id
      - load_balancer
      - matching_rule
      - name
      - origin_set
      - origin_set_name
      type: object
    LoadBalancerOriginSet:
      properties:
        name:
          readOnly: true
          type: string
        origin_set:
          format: uuid
          type: string
        origins:
          readOnly: true
          type: string
        weight:
          maximum: 255
          minimum: 0
          type: integer
      required:
      - name
      - origin_set
      - origins
      type: object
    LoadBalancerTypeEnum:
      description: '* `weighted` - Weighted'
      enum:
      - weighted
      type: string
    Metrics:
      properties:
        bytes:
          type: integer
        cachedBytesPercentage:
          type: number
        cachedHitsPercentage:
          type: number
        errorsPercentage:
          type: number
        hits:
          type: integer
      type: object
    NullEnum:
      enum:
      - null
    Origin:
      properties:
        host:
          maxLength: 255
          pattern: (^(?=.{1,253}\.)[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+)*\.[a-zA-Z]{2,}$)|(^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$)|(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9]))
          type: string
        http_port:
          maximum: 65535
          minimum: 0
          type: integer
        https_port:
          maximum: 65535
          minimum: 0
          type: integer
        id:
          format: uuid
          readOnly: true
          type: string
        is_private_s3:
          type: boolean
        is_s3:
          type: boolean
        msl_data:
          maxLength: 1024
          nullable: true
          type: string
          writeOnly: true
        msl_secret:
          maxLength: 1024
          nullable: true
          type: string
          writeOnly: true
        nonce:
          maxLength: 1024
          nullable: true
          type: string
          writeOnly: true
        path:
          type: string
        protocol:
          $ref: '#/components/schemas/ProtocolEnum'
        s3_aws_region:
          nullable: true
          type: string
        s3_bucket_name:
          nullable: true
          type: string
        secret_key:
          maxLength: 1024
          minLength: 10
          nullable: true
          pattern: ^[a-zA-Z0-9]+$
          type: string
          writeOnly: true
        service:
          format: uuid
          type: string
        service_provider:
          allOf:
          - $ref: '#/components/schemas/ServiceProvider'
          nullable: true
        shield_location:
          nullable: true
        shield_providers:
          items:
            $ref: '#/components/schemas/OriginShieldProvider'
          type: array
        sni_hostname:
          nullable: true
          type: string
        timeout_ms:
          maximum: 600000
          minimum: 0
          nullable: true
          type: integer
        type:
          $ref: '#/components/schemas/OriginTypeEnum'
        verify_tls:
          type: boolean
      required:
      - host
      - id
      - service
      type: object
    OriginSet:
      properties:
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s]*$
          type: string
        origins:
          items:
            $ref: '#/components/schemas/OriginSetMember'
          type: array
        service:
          format: uuid
          type: string
      required:
      - id
      - name
      - origins
      - service
      type: object
    OriginSetMember:
      properties:
        host:
          maxLength: 255
          pattern: (^(?=.{1,253}\.)[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+)*\.[a-zA-Z]{2,}$)|(^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$)|(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9]))
          type: string
        port:
          maximum: 65535
          minimum: 0
          type: integer
        protocol:
          $ref: '#/components/schemas/ProtocolEnum'
        weight:
          maximum: 255
          minimum: 0
          type: integer
      required:
      - host
      - port
      - weight
      type: object
    OriginSetSerializerNew:
      properties:
        failover_config:
          additionalProperties: {}
          type: object
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          type: string
        origins:
          items:
            $ref: '#/components/schemas/Origin'
          type: array
        service:
          format: uuid
          readOnly: true
          type: string
        type:
          maxLength: 255
          type: string
      required:
      - id
      - name
      - origins
      - service
      - type
      type: object
    OriginShieldProvider:
      properties:
        service_provider:
          format: uuid
          type: string
      required:
      - service_provider
      type: object
    OriginTypeEnum:
      description: '* `CUSTOM` - Custom

        * `SERVICE_PROVIDER` - Service Provider

        * `MSL4` - Msl4

        * `MSL5` - Msl5'
      enum:
      - CUSTOM
      - SERVICE_PROVIDER
      - MSL4
      - MSL5
      type: string
    PerformanceCheck:
      properties:
        enabled:
          type: boolean
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          maxLength: 255
          pattern: ^[a-zA-Z0-9_\-\s]*$
          type: string
        service:
          format: uuid
          type: string
        url:
          maxLength: 4096
          type: string
      required:
      - id
      - name
      - service
      - url
      type: object
    Point:
      properties:
        metrics:
          items:
            $ref: '#/components/schemas/ProviderMetrics'
          type: array
        timestamp:
          type: integer
      type: object
    ProtocolConfig:
      properties:
        http2_enabled:
          description: Allow HTTP/2
          type: boolean
        http3_enabled:
          description: Allow HTTP/3
          type: boolean
        id:
          format: uuid
          readOnly: true
          type: string
        ipv6_enabled:
          description: Enable IPv6
          type: boolean
        service:
          format: uuid
          type: string
      required:
      - id
      - service
      type: object
    ProtocolEnum:
      description: '* `HTTP` - Http

        * `HTTPS` - Https

        * `HTTP & HTTPS` - Both'
      enum:
      - HTTP
      - HTTPS
      - HTTP & HTTPS
      type: string
    Provider:
      properties:
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 255
          type: string
      required:
      - id
      - name
      type: object
    ProviderCertificate:
      properties:
        id:
          format: uuid
          readOnly: true
          type: string
        not_valid_after:
          format: date-time
          nullable: true
          type: string
        provider:
          format: uuid
          type: string
        provider_certificate_id:
          type: string
        provider_name:
          readOnly: true
          type: string
      required:
      - id
      - provider
