  /api/v1/aggregated-events/account/{account_id}:
    get:
      description: gets events for account UUID, filtered down with optional query
        params
      parameters:
      - description: Start time in unix-millis (@end param MUST be present)
        in: query
        name: start
        schema:
          type: integer
      - description: End time in unix-millis (@start param MUST be present)
        in: query
        name: end
        schema:
          type: integer
      - description: Comma-separated list of locations (ISO3166-2)
        in: query
        name: locations
        schema:
          type: string
      - description: Comma-separated CDN provider names to filter by
        in: query
        name: providers
        schema:
          type: string
      - description: Comma-separated codes to include
        in: query
        name: codes
        schema:
          type: string
      - description: Comma-separated severity levels to include
        in: query
        name: severities
        schema:
          type: string
      responses:
        '200':
          content:
