        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProviderCommitment'
          description: ''
      security:
      - IORiver authentication: []
      summary: Create a new account provider commitment
      tags:
      - Account provider commitments
